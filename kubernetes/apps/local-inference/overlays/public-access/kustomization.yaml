apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Opt-in overlay: adds the public Ingress on top of the always-on
# in-cluster/LAN-NodePort base. Only ever selected when
# platform_optional_apps.local_inference.public_access_enabled is true -
# see kubernetes/gitops/templates/platform-applications.yaml's conditional
# Application source.path.
resources:
- ../../base
- ingress.yaml

# Example only. Do not include this file in kustomization.yaml and do not apply
# it without replacing the value. Production/trial secrets are normally
# created by Ansible from production_vars.yml, via its own
# platform_secrets.local_inference_api_key key (#91) - not a fallback to
# grafana's/monitoring's credentials; local-inference is a separate security
# boundary. Checked by llama-swap's own apiKeys config as an
# "Authorization: Bearer <key>" header, matching what OpenAI-compatible
# clients (JetBrains AI Assistant, Continue, etc.) send natively - not a
# Traefik BasicAuth challenge.
apiVersion: v1
kind: Secret
metadata:
  name: local-inference-api-key
  namespace: local-inference
type: Opaque
stringData:
  API_KEY: "CHANGE_ME"

# Example only. Do not include this file in kustomization.yaml and do not apply
# it without replacing every value. Production/trial secrets are normally
# created by Ansible from production_vars.yml, via its own
# platform_secrets.local_inference_basic_auth_user/_password keys (#91) - these are not a
# fallback to grafana's/monitoring's credentials; local-inference is a separate security
# boundary.
apiVersion: v1
kind: Secret
metadata:
  name: local-inference-basic-auth
  namespace: local-inference
type: kubernetes.io/basic-auth
stringData:
  username: "CHANGE_ME"
  password: "CHANGE_ME"

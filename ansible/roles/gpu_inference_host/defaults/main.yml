# Refs #91, #92. Host prep only - no cluster workload, no endpoint.
gpu_inference_host_enabled: false

# Required once enabled - no default, so this role can't run against an
# unconfirmed host (see tasks/main.yml).
gpu_inference_host_expected_product_name: ""

# kisak-mesa PPA pin, required once enabled - never track the PPA head.
gpu_inference_host_mesa_ppa: "ppa:kisak/kisak-mesa"
gpu_inference_host_mesa_pinned_version: ""

gpu_inference_host_tuned_profile: throughput-performance
gpu_inference_host_node_label_key: "thekeep.studio/accelerator"
gpu_inference_host_node_label_value: "strix-halo"

# Greeter's default session. Empty leaves it alone; "x11"/"wayland" makes
# the role set it - a value per host, not a branch.
gpu_inference_host_display_session: ""

# LightDM session names for this host's DE (Cinnamon) - override for a
# different DE, independent of the x11/wayland choice above.
gpu_inference_host_display_session_name_x11: cinnamon
gpu_inference_host_display_session_name_wayland: cinnamon-wayland
